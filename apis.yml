name: Bearer
description: >-
  Bearer is a developer-first static application security testing (SAST) platform
  whose open-source CLI (written in Go, Elastic License 2.0) scans source code and
  analyzes data flows to discover, filter, and prioritize security and privacy
  risks. It detects OWASP Top 10 and CWE Top 25 vulnerabilities, tracks sensitive
  data (PII/PHI) across a codebase, and produces GDPR / DPIA / PIA privacy reports.
  Bearer supports Go, Python, PHP, JavaScript, TypeScript, Ruby, and Java, and
  integrates into CI/CD via SARIF, GitLab SAST, and reviewdog output formats. The
  company's commercial platform was acquired by Cycode in 2024; the Bearer CLI
  remains open source. Bearer surfaced in the API Evangelist network as a portfolio
  company of Partech and Point Nine and has been enriched from its public docs,
  GitHub org, and live domain probes.
